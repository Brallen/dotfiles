format = """
${custom.directory}\
$git_branch\
$nix_shell\
$line_break\
$character"""

[directory]
disabled = true

# Inside a repo: always parent/repo, then the two deepest folders, with ..
# standing in for anything skipped between them.
# Outside a repo: the last two components, or ~ at home.
[custom.directory]
description = "Repo-aware working directory"
when = true
shell = ["bash", "--noprofile", "--norc"]
style = "bold cyan"
format = "[$output]($style) "
command = '''
if info=$(git rev-parse --show-toplevel --show-prefix 2>/dev/null); then
  root=${info%%$'\n'*}
  prefix=${info#"$root"}
  prefix=${prefix#$'\n'}
  prefix=${prefix%/}
  parent=${root%/*}
  [ "$parent" = "$HOME" ] && parent='~'
  base="${parent##*/}/${root##*/}"
  case $prefix in
    '') printf '%s' "$base" ;;
    */*/*) rest=${prefix%/*}; printf '%s/../%s/%s' "$base" "${rest##*/}" "${prefix##*/}" ;;
    *) printf '%s/%s' "$base" "$prefix" ;;
  esac
  exit
fi

case $PWD in
  "$HOME") p='~' ;;
  "$HOME"/*) p="~${PWD#"$HOME"}" ;;
  *) p=$PWD ;;
esac

case $p in
  */*) rest=${p%/*}; printf '%s/%s' "${rest##*/}" "${p##*/}" ;;
  *) printf '%s' "$p" ;;
esac
'''

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "

[nix_shell]
symbol = " "
format = "[$symbol]($style)"
