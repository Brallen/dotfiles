format = """
${custom.directory}\
$git_branch\
$nix_shell\
$line_break\
$character"""

[directory]
disabled = true

# Inside a repo: always the repo name, then the deepest folder, with ..
# standing in for anything skipped between them.
# Outside a repo: the last component, or ~ at home.
[custom.directory]
description = "Repo-aware working directory"
when = true
shell = ["bash", "--noprofile", "--norc"]
style = "bold cyan"
format = "[$output]($style) "
command = '''
if info=$(git rev-parse --show-toplevel --show-prefix 2>/dev/null); then
  root=${info%%$'\n'*}
  prefix=${info#"$root"}
  prefix=${prefix#$'\n'}
  prefix=${prefix%/}
  base=${root##*/}
  case $prefix in
    '') printf '%s' "$base" ;;
    */*) printf '%s/../%s' "$base" "${prefix##*/}" ;;
    *) printf '%s/%s' "$base" "$prefix" ;;
  esac
  exit
fi

case $PWD in
  "$HOME") p='~' ;;
  "$HOME"/*) p="~${PWD#"$HOME"}" ;;
  *) p=$PWD ;;
esac

case $p in
  /) printf '/' ;;
  */*) printf '%s' "${p##*/}" ;;
  *) printf '%s' "$p" ;;
esac
'''

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "

[nix_shell]
symbol = " "
format = "[$symbol]($style)"
